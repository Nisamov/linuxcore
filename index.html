        function setCookie(name, value, days=365) {
            let expires = "";
            if (days) {
                const d = new Date();
                d.setTime(d.getTime() + days*24*60*60*1000);
                expires = "; expires="+d.toUTCString();
            }
            document.cookie = name + "=" + (value || "")  + expires + "; path=/";
        }

        function getCookie(name) {
            const cname = name + "=";
            const ca = document.cookie.split(';');
            for(let i=0; i<ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(cname) === 0) return c.substring(cname.length, c.length);
            }
            return null;
        }

                        opt.value = t;
                        opt.textContent = t === 'neon' ? 'Neon (Desbloqueado)' : 'Glitch (Desbloqueado)';
                        selector.appendChild(opt);
                    }
                }
            });
        }

        async function loadSourceData(fileName) {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            // Nueva ruta: db/ (relativo al document root)
            const routesToTry = [
                `db/${fileName}`,
                `/db/${fileName}`
            ];
            let response = null;
            let incomingData = null;
            for (let route of routesToTry) {
                try {
                    response = await fetch(route);
                    if (response.ok) {
                        incomingData = await response.json();
                        break;
                    }
                } catch (_) {}
            }
            try {
                if (!response || !response.ok || !incomingData) throw new Error('No se pudo cargar el archivo');
                let normalized = [];
                if (!Array.isArray(incomingData)) {
                    normalized = Object.keys(incomingData).map(key => {
                        const item = incomingData[key];
                        return {
                            comando: item.comando || item.servicio || key,
                            descripcion: item.descripcion || '',
                            estructura: item.estructura || item.comando_servicio || '',
                            categoria_db: item.categoria_db || 'general',
                            opciones: item.opciones || item.configuraciones || [],
                            instalacion: item.instalacion || {},
                            ejemplos: item.ejemplos || []
                        };
                    });
                } else {
                    normalized = incomingData.map(item => ({
                        comando: item.comando || item.servicio || 'unknown',
                        descripcion: item.descripcion || '',
                        estructura: item.estructura || item.comando_servicio || '',
                        categoria_db: item.categoria_db || 'general',
                        opciones: item.opciones || item.configuraciones || [],
                        instalacion: item.instalacion || {},
                        ejemplos: item.ejemplos || []
                    }));
                }
                rawDataset = normalized;
                rebuildCategoryFilter();
                filterData();
                if (rawDataset.length > 0) {
                    renderTargetDetails(rawDataset[0].comando);
                } else {
                    showEmptyState();
                }
            } catch (err) {
                console.error("Error al leer JSON:", err);
                document.getElementById('data-list').innerHTML = `
                            <div class="p-4 text-xs text-red-500 font-mono space-y-2">
                                <p class="font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Error al cargar "${fileName}"</p>
                                <p class="opacity-70">Asegúrate de que el archivo exista en <code>db/</code> y tenga formato JSON válido.</p>
                                <p class="text-[10px] opacity-50">Consejo: Usa un servidor local (Live Server, Nginx) para evitar problemas CORS.</p>
                            </div>`;
                showEmptyState();
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 200);
            }
        }

        function handleSourceFormatChange() {
            activeFormat = document.getElementById('source-format-filter').value;
            document.getElementById('search-input').value = '';
            const icon = document.getElementById('format-icon');
            if (activeFormat === 'raw_markdown') {
                icon.className = "fa-solid fa-file-lines absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-xs opacity-60";
                // Cargar lista de guías .md desde el servidor (si existe un index)
                // Por ahora usamos datos mock, pero se puede extender para leer un listado
                rawDataset = [
                    { id: "docker-info", titulo: "Docker - Instalación y despliegue", descripcion: "Guía completa para contenedores en sistemas Core.", categoria_db: "container", tipo: "markdown" },
                    { id: "mysql-backups", titulo: "MySQL - Estrategias de respaldo", descripcion: "Métodos de dump, restauración y replicación.", categoria_db: "databases", tipo: "markdown" },
                    { id: "nginx-tuning", titulo: "Nginx - Optimización de rendimiento", descripcion: "Ajustes de worker, buffers y caché.", categoria_db: "web", tipo: "markdown" }
                ];
                rebuildCategoryFilter();
                filterData();
                if (rawDataset.length > 0) {
                    renderTargetDetails(rawDataset[0].id);
                }
            } else {
                icon.className = "fa-solid fa-database absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-xs opacity-60";
                loadSourceData(activeFormat);
            }
        }

        function rebuildCategoryFilter() {
            const select = document.getElementById('category-filter');
            select.innerHTML = '<option value="all">Ver Todo el Sistema</option>';
            const categories = [...new Set(rawDataset.map(item => item.categoria_db))].filter(Boolean);
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat.toUpperCase().replace('_', ' ');
                select.appendChild(opt);
            });
        }

        function filterData() {
            const searchValue = document.getElementById('search-input').value.toLowerCase();
            const categoryValue = document.getElementById('category-filter').value;
            const filtered = rawDataset.filter(item => {
                const term = (activeFormat === 'raw_markdown') ? (item.titulo || '') : (item.comando || '');
                const desc = item.descripcion || '';
                const matchSearch = term.toLowerCase().includes(searchValue) || desc.toLowerCase().includes(searchValue);
                const matchCategory = (categoryValue === 'all') || (item.categoria_db === categoryValue);
                return matchSearch && matchCategory;
            });
            renderLeftMenu(filtered);
        }

        function renderLeftMenu(items) {
            const list = document.getElementById('data-list');
            document.getElementById('items-count').textContent = items.length;
            list.innerHTML = '';
            if (items.length === 0) {
                list.innerHTML = `<li class="text-sm p-4 text-center italic opacity-40">Sin coincidencias</li>`;
                return;
            }
            const theme = THEMES[currentTheme];
            items.forEach(item => {
                const id = (activeFormat === 'raw_markdown') ? item.id : item.comando;
                const isService = (activeFormat === 'services.json');
                const isMarkdown = (activeFormat === 'raw_markdown');
                let iconClass = 'fa-terminal';
                if (isService) iconClass = 'fa-cogs';
                else if (isMarkdown) iconClass = 'fa-file-lines';
                const prefix = isService ? '⚙ ' : (isMarkdown ? '' : '$ ');
                const displayName = isMarkdown ? item.titulo : `${prefix}${item.comando}`;
                const li = document.createElement('li');
                li.innerHTML = `
                            <button onclick="renderTargetDetails('${id}')" id="node-btn-${id}"
                                    class="w-full text-left px-4 py-3 text-sm font-mono transition-all flex items-center justify-between ${theme.hoverItem}">
                                <span class="flex items-center gap-2 truncate">
                                    <i class="fa-solid ${iconClass} opacity-60 text-xs"></i>
                                    <span class="font-semibold truncate">${displayName}</span>
                                </span>
                                <span class="category-badge ${getCategoryColor(item.categoria_db)}">${item.categoria_db || 'general'}</span>
                            </button>
                        `;
                list.appendChild(li);
            });
            refreshActiveElementUI();
        }

        function getCategoryColor(cat) {
            const map = {
                'system': 'bg-blue-500/20 text-blue-300',
                'network': 'bg-green-500/20 text-green-300',
                'security': 'bg-red-500/20 text-red-300',
                'container': 'bg-cyan-500/20 text-cyan-300',
                'databases': 'bg-yellow-500/20 text-yellow-300',
                'web': 'bg-purple-500/20 text-purple-300',
                'general': 'bg-gray-500/20 text-gray-300'
            };
            return map[cat] || map['general'];
        }

        function refreshActiveElementUI() {
            if (!currentActiveId) return;
            const theme = THEMES[currentTheme];
            document.querySelectorAll('#data-list button').forEach(btn => {
                btn.className = `w-full text-left px-4 py-3 text-sm font-mono transition-all flex items-center justify-between ${theme.hoverItem}`;
            });
            const target = document.getElementById(`node-btn-${currentActiveId}`);
            if (target) {
                target.className = `w-full text-left px-4 py-3 text-sm font-mono transition-all flex items-center justify-between ${theme.activeItem}`;
            }
        }

        function renderTargetDetails(id) {
            currentActiveId = id;
            const target = rawDataset.find(item => ((activeFormat === 'raw_markdown') ? item.id : item.comando) === id);
            if (!target) return;
            refreshActiveElementUI();
            document.getElementById('empty-state').classList.add('hidden');
            const viewport = document.getElementById('render-viewport');
            viewport.className = 'flex-1 overflow-y-auto p-8 md:p-12 space-y-8 max-w-6xl w-full mx-auto block';
            viewport.innerHTML = '';
            const theme = THEMES[currentTheme];
            if (activeFormat !== 'raw_markdown') {
                const isService = (activeFormat === 'services.json');
                const titleLabel = isService ? 'SERVICIO DEL SISTEMA' : 'COMANDO';
                const syntaxLabel = isService ? 'Línea de inicialización / demonio' : 'Sintaxis operativa';
                const tableCol1 = isService ? 'Directiva / Parámetro' : 'Flag';
                const tableCol2 = isService ? 'Impacto en el entorno' : 'Descripción de ejecución';
                const tableTitle = isService ? 'Módulos y configuración interna' : 'Flags y parámetros';
                viewport.innerHTML = `
                            <div class="p-8 ${theme.card}">
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-xs font-mono px-3 py-1 uppercase ${theme.tag}">${target.categoria_db || 'System'}</span>
                                    <span class="text-xs font-mono text-current opacity-60"><i class="fa-regular fa-circle-check"></i> ${titleLabel}</span>
                                </div>
                                <h2 class="text-4xl font-black tracking-tight mb-4 ${theme.h2} manual-title">${target.comando}</h2>
                                <p class="text-base leading-relaxed text-current">${target.descripcion}</p>
                            </div>
                            <div class="space-y-3">
                                <div class="text-xs font-bold uppercase tracking-wider font-mono text-current opacity-60 flex items-center gap-2">
                                    <i class="fa-regular fa-rectangle-list"></i> ${syntaxLabel}
                                </div>
                                <div class="p-5 flex justify-between items-center ${theme.codeBlock}">
                                    <code id="raw-syntax" class="font-bold text-base select-all">${isService ? '' : '$ '}${target.estructura || target.comando}</code>
                                    <button onclick="copyRawText('raw-syntax', this)" class="copy-btn flex items-center gap-1">
                                        <i class="fa-regular fa-copy"></i> Copiar
                                    </button>
                                </div>
                            </div>
                            <div class="space-y-3">
                                <div class="text-xs font-bold uppercase tracking-wider font-mono text-current opacity-60 flex items-center gap-2">
                                    <i class="fa-regular fa-flag"></i> ${tableTitle}
                                </div>
                                <div class="overflow-hidden ${theme.card}">
                                    <table class="w-full text-left text-sm border-collapse options-table">
                                        <thead>
                                            <tr class="${theme.tableHeader} text-xs uppercase tracking-wider">
                                                <th class="p-4 w-1/3">${tableCol1}</th>
                                                <th class="p-4 w-2/3">${tableCol2}</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-500/10 font-mono text-sm text-current">
                                            ${renderCommandFlags(target.opciones, theme)}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div class="space-y-3">
                                    <div class="text-xs font-bold uppercase tracking-wider font-mono text-current opacity-60 flex items-center gap-2">
                                        <i class="fa-regular fa-box-archive"></i> Gestión y ciclo de vida
                                    </div>
                                    <div class="p-4 space-y-3 ${theme.card}">${renderInstallationBlock(target.instalacion, theme)}</div>
                                </div>
                                <div class="space-y-3">
                                    <div class="text-xs font-bold uppercase tracking-wider font-mono text-current opacity-60 flex items-center gap-2">
                                        <i class="fa-regular fa-code"></i> Casos de uso prácticos
                                    </div>
                                    <div class="space-y-3">${renderExamplesBlock(target.ejemplos, theme)}</div>
                                </div>
                            </div>
                        `;
            } else {
                // Para guías .md, podemos intentar cargar el contenido real desde db/guides/...
                // Por simplicidad mantenemos el mock
                viewport.innerHTML = `
                            <div class="p-8 ${theme.card}">
                                <span class="text-xs font-mono px-3 py-1 uppercase ${theme.tag}">${target.categoria_db}</span>
                                <h2 class="text-3xl font-bold mt-4 mb-2 ${theme.h2}">${target.titulo}</h2>
                                <hr class="border-gray-500/20 my-4" />
                                <div class="space-y-4 text-base text-current">
                                    <p>${target.descripcion}</p>
                                    <div class="p-4 ${theme.codeBlock} font-mono text-sm">
                                        # Contenido mapeado desde el repositorio de Nisamov<br />
                                        $ cat /workspaces/repo/${target.categoria_db}/${target.id.split('-')[0]}.md
                                    </div>
                                    <p class="text-xs opacity-60">* Esta es una vista previa de la guía. Para acceder al contenido completo, consulta el archivo Markdown en el repositorio.</p>
                                </div>
                            </div>
                        `;
            }
        }

        function renderCommandFlags(opciones, theme) {
            if (!opciones || opciones.length === 0) {
                return `<tr><td colspan="2" class="p-4 italic opacity-50 text-center text-xs">Este módulo no requiere parámetros variables.</td></tr>`;
            }
            return opciones.map(opt => {
                const paramValue = opt.parametro || opt.directiva || 'Config';
                const flags = Array.isArray(paramValue) ? paramValue : [paramValue];
                const badgeHtml = flags.map(f => `<span class="px-2 py-1 font-bold ${theme.tag} text-xs">${f}</span>`).join(' ');
                const descValue = opt.descripcion || opt.efecto || 'Sin descripción detallada.';
                return `
                            <tr class="${theme.tableRow}">
                                <td class="p-4 flex flex-wrap gap-2">${badgeHtml}</td>
                                <td class="p-4 text-sm leading-relaxed">${descValue}</td>
                            </tr>
                        `;
            }).join('');
        }

        function renderInstallationBlock(instalacion, theme) {
            if (!instalacion || !instalacion.es_instalable) {
                return `<p class="italic opacity-50 text-center py-6 text-sm font-mono">Componente nativo del sistema base.</p>`;
            }
            const pasos = instalacion.pasos || {};
            return Object.keys(pasos).map((distro, i) => `
                        <div class="p-3 bg-black/5 rounded-xl border border-gray-500/10 flex items-center justify-between gap-3 font-mono text-xs mb-2">
                            <div class="truncate flex-1">
                                <span class="text-[10px] font-bold opacity-60 block uppercase tracking-wider">${distro.replace('_', ' ')}</span>
                                <code id="inst-${i}" class="font-semibold text-current select-all text-sm">${pasos[distro]}</code>
                            </div>
                            <button onclick="copyRawText('inst-${i}', this)" class="copy-btn">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    `).join('');
        }

        function renderExamplesBlock(ejemplos, theme) {
            if (!ejemplos || ejemplos.length === 0) {
                return `<p class="italic opacity-50 text-center py-6 text-sm font-mono">Sin muestras prácticas registradas.</p>`;
            }
            return ejemplos.map((ex, i) => {
                const commandValue = ex.uso || ex.comando_ejemplo || '#';
                return `
                            <div class="p-4 ${theme.card} space-y-2">
                                <div class="p-3 flex justify-between items-center ${theme.codeBlock} text-sm">
                                    <code id="ex-${i}" class="font-bold select-all">${commandValue}</code>
                                    <button onclick="copyRawText('ex-${i}', this)" class="copy-btn">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </div>
                                <p class="text-xs leading-relaxed px-1 font-sans text-current opacity-80">${ex.explicacion}</p>
                            </div>
                        `;
            }).join('');
        }

        function showEmptyState() {
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('render-viewport').classList.add('hidden');
        }

        function copyRawText(elementId, button) {
            const raw = document.getElementById(elementId).textContent;
            const clean = raw.startsWith('$ ') ? raw.substring(2) : raw;
            navigator.clipboard.writeText(clean).then(() => {
                const icon = button.querySelector('i');
                icon.className = 'fa-regular fa-check text-green-500';
                setTimeout(() => {
                    icon.className = 'fa-regular fa-copy';
                }, 1200);
            });
        }

        function initPopupAndToasts() {
            let supportTimer = null;
            let isPopupVisible = false;
            const container = document.getElementById('popup-container');
            const closeBtn = document.getElementById('popup-close');
            const messageEl = document.getElementById('popup-message');
            const actionEl = document.getElementById('popup-action');

            function showSupportPopup() {
                if (isPopupVisible) return;
                const idx = Math.floor(Math.random() * supportMessages.length);
                const msg = supportMessages[idx];
                messageEl.textContent = msg.text;
                actionEl.textContent = msg.action;
                actionEl.onclick = () => { window.open(msg.link, '_blank'); };
                container.style.display = 'block';
                isPopupVisible = true;
                setTimeout(() => {
                    container.style.display = 'none';
                    isPopupVisible = false;
                }, 15000);
            }

            function scheduleSupportPopup() {
                if (supportTimer) clearTimeout(supportTimer);
                const delay = 5000 + Math.random() * 25000;
                supportTimer = setTimeout(() => {
                    showSupportPopup();
                    scheduleSupportPopup();
                }, delay);
            }

            closeBtn.addEventListener('click', () => {
                container.style.display = 'none';
                isPopupVisible = false;
                if (supportTimer) {
                    clearTimeout(supportTimer);
                    supportTimer = null;
                }
                scheduleSupportPopup();
            });

            scheduleSupportPopup();

            const toastContainer = document.getElementById('toast-container');
            let toastTimer = null;

            function showSecretToast() {
                const idx = Math.floor(Math.random() * secretMessages.length);
                const msg = secretMessages[idx];
                const toast = document.createElement('div');
                toast.className = 'toast-message';
                toast.textContent = msg.text;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 20000);
            }

            function scheduleSecretToast() {
                if (toastTimer) clearTimeout(toastTimer);
                const delay = 30000 + Math.random() * 20000;
                toastTimer = setTimeout(() => {
                    showSecretToast();
                    scheduleSecretToast();
                }, delay);
            }

            setTimeout(() => {
                showSecretToast();
                scheduleSecretToast();
            }, 5000);
        }

        function startConsoleSpam() {
            function sendConsoleMessage() {
                const idx = Math.floor(Math.random() * consoleMessages.length);
                const msg = consoleMessages[idx];
                if (msg.style) {
                    console.log(`%c${msg.text}`, msg.style);
                } else {
                    console.log(msg.text);
                }
                const nextDelay = 8000 + Math.random() * 12000;
                setTimeout(sendConsoleMessage, nextDelay);
            }
            setTimeout(sendConsoleMessage, 3000);
        }

        function toggleCodePanel() {
            const panel = document.getElementById('code-panel');
            if (panel.style.display === 'flex') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'flex';
                document.getElementById('code-1').focus();
            }
        }

        function moveNext(input, index) {
            if (input.value.length >= 1) {
                const next = document.getElementById(`code-${index+1}`);
                if (next) next.focus();
            }
        }

        function verifyCode() {
            const c1 = document.getElementById('code-1').value;
            const c2 = document.getElementById('code-2').value;
            const c3 = document.getElementById('code-3').value;
            const c4 = document.getElementById('code-4').value;
            const entered = c1 + c2 + c3 + c4;
            const msg = document.getElementById('code-message');
            const clearInputs = () => {
                document.querySelectorAll('.code-input').forEach(inp => inp.value = '');
                document.getElementById('code-1').focus();
            };

            switch (entered) {
                case '2026':
                    if (!unlockedThemes.includes('neon')) {
                        unlockedThemes.push('neon');
                        setCookie("unlockedThemes", JSON.stringify(unlockedThemes));
                        addUnlockedThemesToSelector();
                        msg.textContent = '¡Tema Neon desbloqueado! 🎉';
                        msg.className = '';
                        applyTheme('neon');
                    } else {
                        msg.textContent = 'Tema Neon ya desbloqueado.';
                        msg.className = '';
                    }
                    clearInputs();
                    break;
                case '0000':
                    if (!unlockedThemes.includes('glitch')) {
                        unlockedThemes.push('glitch');
                        setCookie("unlockedThemes", JSON.stringify(unlockedThemes));
                        addUnlockedThemesToSelector();
                        msg.textContent = '¡Tema Glitch desbloqueado! 🤖';
                        msg.className = '';
                        applyTheme('glitch');
                    } else {
                        msg.textContent = 'Tema Glitch ya desbloqueado.';
                        msg.className = '';
                    }
                    clearInputs();
                    break;
                case '9999':
                    window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
                    clearInputs();
                    msg.textContent = 'Redirigiendo...';
                    msg.className = '';
                    break;
                case '6666':
                    showVerseOverlay();
                    clearInputs();
                    msg.textContent = 'Versículo mostrado.';
                    msg.className = '';
                    break;
                case '7895':
                    document.body.classList.toggle('scrambled');
                    clearInputs();
                    msg.textContent = document.body.classList.contains('scrambled') ? '¡Efecto scrambler activado!' : 'Efecto scrambler desactivado.';
                    msg.className = '';
                    break;
                default:
                    msg.textContent = 'Código incorrecto.';
                    msg.className = 'code-error';
                    clearInputs();
            }
            setTimeout(() => {
                if (msg.className !== 'code-error') {
                    msg.textContent = '';
                }
            }, 5000);
        }

        function showVerseOverlay() {
            const existing = document.getElementById('verse-overlay');
            if (existing) existing.remove();
            const overlay = document.createElement('div');
            overlay.id = 'verse-overlay';
            overlay.innerHTML = `
                <div>
                    "Someteos, pues, a Dios; resistid al diablo, y huirá de vosotros"
                    <small>Haz clic para cerrar</small>
                </div>
            `;
            overlay.onclick = () => overlay.remove();
            document.body.appendChild(overlay);
        }

        function toggleShareDropdown() {
            const dropdown = document.getElementById('shareDropdown');
            dropdown.style.display = (dropdown.style.display === 'flex') ? 'none' : 'flex';
        }

        function shareOn(platform) {
            const url = encodeURIComponent('https://github.com/nisamov/linuxcore');
            const title = encodeURIComponent('LinuxCore · Manual Técnico de Linux');
            const desc = encodeURIComponent('Base de comandos y servicios de Linux, guías estructuradas y documentación técnica.');
            let shareUrl = '';
            switch (platform) {
                case 'facebook': shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${url}`; break;
                case 'twitter': shareUrl = `https://twitter.com/intent/tweet?text=${title}&url=${url}`; break;
                case 'linkedin': shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`; break;
                case 'whatsapp': shareUrl = `https://api.whatsapp.com/send?text=${title}%20${url}`; break;
                case 'telegram': shareUrl = `https://t.me/share/url?url=${url}&text=${title}`; break;
                case 'mail': shareUrl = `mailto:?subject=${title}&body=${desc}%0A%0A${url}`; break;
                default: return;
            }
            if (shareUrl) window.open(shareUrl, '_blank', 'width=600,height=400');
            document.getElementById('shareDropdown').style.display = 'none';
        }

        document.addEventListener('click', function(e) {
            const fab = document.getElementById('shareFab');
            const dropdown = document.getElementById('shareDropdown');
            if (!fab.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
