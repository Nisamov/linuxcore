name: Validar Estructura General de Archivos JSON

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validar sintaxis de archivos JSON
        run: |
          python -c '
          import json, sys, glob

          # Busca todos los archivos JSON del proyecto
          json_files = glob.glob("**/*.json", recursive=True)
          errors = 0

          for file in json_files:
              try:
                  with open(file, "r", encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  print(f"Error en el archivo {file}: {e}")
                  errors += 1

          if errors > 0:
              print(f"\nSe encontraron {errors} archivos con formato JSON inválido.")
              sys.exit(1)
          else:
              print("Todos los archivos JSON son válidos.")
          '